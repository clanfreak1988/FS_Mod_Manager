[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-mod-manager"
version = "0.2.0"
description = "Farming Simulator Mod Manager"
requires-python = ">=3.11"
dependencies = [
    # >=6.8 for QStyleHints.setColorScheme()/unsetColorScheme() (Dark/Light
    # theme switching, see gui/theme.py). Degrades gracefully (feature
    # no-ops) if an older PySide6 ends up installed anyway.
    "PySide6>=6.8",
    "Pillow>=10.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsmodmanager = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Tests mit echten Mod-ZIPs (tests/integration/fixtures/, gitignored)",
]
