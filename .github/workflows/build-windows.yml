name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .[build]

      - name: Build exe
        run: pwsh -File packaging/windows/build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: FSModManager-windows
          path: dist/FSModManager.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FSModManager.exe
