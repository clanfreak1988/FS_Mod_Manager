name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[build]

      - name: Build exe
        run: pwsh -File packaging/windows/build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: FSModManager-windows
          path: dist/FSModManager.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[build]

      - name: Install appimagetool
        run: |
          wget -q -O /usr/local/bin/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FSModManager-linux
          path: dist/FSModManager-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FSModManager-windows/FSModManager.exe
            artifacts/FSModManager-linux/FSModManager-x86_64.AppImage
